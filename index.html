<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はるゆいゲーム Deluxe</title>

<style>
body{
    margin:0;
    font-family:"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
    text-align:center;
    background:linear-gradient(#ffeef8,#fffde8);
    overflow:auto;
}

h1{
    color:#ff4fa0;
    margin:20px 0;
    font-size:28px
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

#message{
    font-size:20px;
    color:#ff4fa0;
    font-weight:bold;
    min-height:50px;
    margin:15px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
}

.card{
    width:90px;
    height:90px;
    font-size:48px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:white;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
    cursor:pointer;
}

.card.used{
    background:#ffd7ea;
}

.menuButton{
    display:block;
    width:280px;
    margin:20px auto;
    padding:18px;
    font-size:20px;
    border:none;
    border-radius:20px;
    color:white;
    cursor:pointer;
}

.haruno{
    background:#ff6db5;
}

.yuino{
    background:#ff8f50;
}

.action{
    display:none;
    margin:10px;
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:20px;
    color:white;
    cursor:pointer;
}

#jijiBtn{
    background:#4fa7ff;
}

#youBtn{
    background:#ff6db5;
}

#result{
    min-height:120px;
}

.big{
    font-size:28px;
    color:#ff4fa0;
    font-weight:bold;
}

.sub{
    font-size:28px;
    color:#ff7a00;
    font-weight:bold;
}

.back{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#888;
    color:white;
    font-size:18px;
}

.particle{
    position:fixed;
    pointer-events:none;
    animation:float 4s linear forwards;
}

@keyframes float{
    from{
        opacity:1;
        transform:translateY(0) scale(.5);
    }
    to{
        opacity:0;
        transform:translateY(-380px) scale(1.8) rotate(360deg);
    }
}

#ending{
    font-size:20px;
    color:#8e24aa;
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- タイトル -->

<div id="titleScreen" class="screen active">

<h1>🌸 はるゆいゲーム 🌸</h1>

<h2>どっちであそぶ？</h2>

<button class="menuButton haruno"
onclick="startGame('haruno')">
🌸 はるのちゃんゲーム
</button>

<button class="menuButton yuino"
onclick="startGame('yuino')">
💖 ゆいのちゃんゲーム
</button>

<div id="ending"></div>

</div>

<!-- ゲーム画面 -->

<div id="gameScreen" class="screen">

<h1 id="gameTitle"></h1>

<div id="message"></div>

<div class="cards" id="cards"></div>

<div id="result"></div>

<button id="jijiBtn"
class="action"
onclick="loveAction('jiji')">
🧓 じいじだいすき！
</button>

<button id="youBtn"
class="action"
onclick="loveAction('you')">
👵 ようちゃんだいすき！
</button>

<br>

<button class="back"
onclick="backToMenu()">
もどる
</button>

</div>

<script>

let currentAnswer=[];
let currentName="";
let clearedHaruno=false;
let clearedYuino=false;

function startGame(type){

    document.getElementById("titleScreen")
    .classList.remove("active");

    document.getElementById("gameScreen")
    .classList.add("active");

    document.getElementById("result").innerHTML="";
    document.getElementById("jijiBtn").style.display="none";
    document.getElementById("youBtn").style.display="none";

    if(type==="haruno"){

        currentAnswer=["は","る","の"];

        currentName="🌸 はるのちゃん 🌸";

        document.getElementById("gameTitle")
        .innerHTML="🌸 はるのちゃんゲーム 🌸";

    }else{

        currentAnswer=["ゆ","い","の"];

        currentName="💖 ゆいのちゃん 💖";

        document.getElementById("gameTitle")
        .innerHTML="💖 ゆいのちゃんゲーム 💖";
    }

    createCards();
}

function createCards(){

    let area=document.getElementById("cards");

    area.innerHTML="";

    let pos=0;

    document.getElementById("message")
    .innerHTML=
    currentAnswer.join(" → ") + " のじゅんにおしてね！";

    currentAnswer.forEach(letter=>{

        const btn=document.createElement("button");

        btn.className="card";

        btn.innerHTML=letter;

        btn.onclick=function(){

            if(letter===currentAnswer[pos]){

                btn.classList.add("used");
                btn.disabled=true;

                pos++;

                if(pos===currentAnswer.length){

                    success();
                }

            }else{

                document.getElementById("message")
                .innerHTML="😊 おしい！もういちど！";

                setTimeout(createCards,1200);
            }
        };

        area.appendChild(btn);

    });
}

function success(){

    playClap();

    setTimeout(playClap,900);

    if(navigator.vibrate){
        navigator.vibrate([120,80,120]);
    }

    fireworks(150);

    document.getElementById("result")
    .innerHTML=
    "<div class='big'>"+
    currentName+
    "</div><div class='sub'>かわいい！💖</div>";

    document.getElementById("message")
    .innerHTML="👏 パチパチパチ！ 👏";

    document.getElementById("jijiBtn")
    .style.display="inline-block";

    document.getElementById("youBtn")
    .style.display="inline-block";

    if(currentAnswer[0]==="は"){
        clearedHaruno=true;
    }else{
        clearedYuino=true;
    }

    checkEnding();
}

function loveAction(type){

    fireworks(100);

    if(type==="jiji"){
        document.getElementById("message")
        .innerHTML="🧓 じいじ だいすき！💖";
    }

    if(type==="you"){
        document.getElementById("message")
        .innerHTML="👵 ようちゃん だいすき！💖";
    }

    playClap();
}

function checkEnding(){

    if(clearedHaruno && clearedYuino){

        document.getElementById("ending")
        .innerHTML=
        "🏆 なかよししまい！<br><br>" +
        "🌸 はるのちゃん と 💖 ゆいのちゃん<br>" +
        "だいせいこう！✨<br><br>" +
        "🧓 じいじ にっこり 😊<br>" +
        "👵 ようちゃん にっこり 😊";

        fireworks(300);

        setTimeout(playClap,500);
        setTimeout(playClap,1200);
    }
}

function backToMenu(){

    document.getElementById("gameScreen")
    .classList.remove("active");

    document.getElementById("titleScreen")
    .classList.add("active");
}

function fireworks(count){

    const icons=["⭐","✨","💖","🌸"];

    for(let i=0;i<count;i++){

        const p=document.createElement("div");

        p.className="particle";

        p.innerHTML=
        icons[Math.floor(Math.random()*icons.length)];

        p.style.left=Math.random()*100+"vw";

        p.style.top=
        (65+Math.random()*25)+"vh";

        p.style.fontSize=
        (20+Math.random()*25)+"px";

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },4000);
    }
}

function playClap(){

    const ctx =
    new (window.AudioContext ||
    window.webkitAudioContext)();

    function single(time,strength){

        const size=ctx.sampleRate*0.12;

        const buffer=
        ctx.createBuffer(1,size,ctx.sampleRate);

        const data=
        buffer.getChannelData(0);

        for(let i=0;i<size;i++){

            data[i]=Math.random()*2-1;
        }

        const noise=
        ctx.createBufferSource();

        noise.buffer=buffer;

        const filter=
        ctx.createBiquadFilter();

        filter.type="bandpass";

        filter.frequency.value=
        1500+Math.random()*1200;

        const gain=
        ctx.createGain();

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.setValueAtTime(
        0.0001,time);

        gain.gain.exponentialRampToValueAtTime(
        0.9*strength,time+0.003);

        gain.gain.exponentialRampToValueAtTime(
        0.0001,time+0.08);

        noise.start(time);
        noise.stop(time+0.08);
    }

    const t=ctx.currentTime;

    single(t+0.00,1.0);
    single(t+0.15,0.9);
    single(t+0.33,1.0);
    single(t+0.46,0.8);
    single(t+0.65,1.1);
    single(t+0.82,0.9);
}

</script>

</body>
</html>
